<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0A0810" />

    <!--
      These are the fallback values for a crawler or for the first paint before
      React boots. Once the app loads, the title and description are rewritten
      from the event_config row so an admin can change them without a rebuild.
    -->
    <title>Kanto League – Jarvis Hackathon 3.0</title>
    <meta
      name="description"
      content="Kanto League – Jarvis Hackathon 3.0. I chose Win. A Pokémon-themed hackathon at SLRTCE: form a team, combine your forces, and defeat the gym leaders."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Both fonts are self-hosted (see scripts/fetch-fonts.mjs). Preloading them
      means text paints in the real face on first render instead of swapping
      after a round trip, which is what causes the layout shift Lighthouse
      penalises. `crossorigin` is required even though the request is
      same-origin, or the preload is discarded and fetched twice.
    -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-06408904.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/press-start-2p-afec8699.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Paint the page background before any CSS or JS arrives: no white flash. -->
    <style>
      html {
        background-color: #0a0810;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #f5f2f7">
        <h1>Kanto League – Jarvis Hackathon 3.0</h1>
        <p>I chose Win.</p>
        <p>This site needs JavaScript. Please enable it and reload.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
